name: Deploy spherical-gallery to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/spherical-gallery-gsap-lo5be5]
    paths:
      - spherical-gallery/**
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the gallery as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: spherical-gallery
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
